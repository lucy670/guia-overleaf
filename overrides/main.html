{% extends "base.html" %}

{% block announce %}
<div style="display: flex; justify-content: center; align-items: center; padding: 2px;">
    <span style="margin-right: 10px; font-size: 0.8rem;">Translate:</span>
    <div id="google_translate_element"></div>
</div>

<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'es', 
    includedLanguages: 'en,fr,de', // Idiomas a los que permites traducir
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
    autoDisplay: false
  }, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<style>
    .goog-te-banner-frame.skiptranslate { display: none !important; } 
    body { top: 0px !important; }
    #google_translate_element select {
        background: transparent;
        color: white; /* Ajusta esto según tu tema */
        border: 1px solid white;
        padding: 2px;
        border-radius: 4px;
    }
    .goog-te-gadget-simple {
        background-color: transparent !important;
        border: none !important;
    }
    .goog-te-gadget-simple .goog-te-menu-value span {
        color: white !important; /* Texto blanco */
    }
</style>
{% endblock %}
